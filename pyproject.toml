[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micdrop"
version = "0.3.0"
description = "Hold a hotkey, speak, release: your words are cleaned up or turned into the thing you asked for, then pasted."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["voice", "dictation", "whisper", "llm", "wayland", "gnome", "fedora", "clipboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Text Processing :: Linguistic",
]

# Core runtime: audio capture, speech-to-text, local text models, Linux hotkeys.
dependencies = [
    "numpy",
    "sounddevice",
    "soundfile",
    "transformers",
    "torch",
    "peft",
    "accelerate",
    # Cloud provider client. Always installed so a mode can be switched to
    # groq by editing one config line rather than installing a package.
    "groq",
    "evdev; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Everything needed to use MicDrop after `pip install micdrop` on a normal
# machine. Kept as an extra so the base install stays light.
dev = [
    "huggingface_hub",
]

[project.urls]
Homepage = "https://github.com/enayut/micdrop"
Source = "https://github.com/enayut/micdrop"

[project.scripts]
micdrop = "micdrop.cli.main:main"

[tool.setuptools.packages.find]
include = ["micdrop*"]
exclude = ["micdrop.tests*"]